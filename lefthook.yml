pre-commit:
  parallel: true
  jobs:
    - name: Biome
      glob: "*.{js,jsx,ts,tsx,json,css,md,yml}"
      run: bun run check {staged_files}
      stage_fixed: true
    - name: Typecheck
      run: bun run typecheck

commit-msg:
  jobs:
    - name: Commitlint
      run: bun run commitlint --edit {1}
